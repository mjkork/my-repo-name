  <title>MyShots — Archery Companion</title>
  <desc>MyShots banner. Left side: stylized gold bow tucked against the MYSHOTS wordmark in gold serif capitals, a diagonal arrow passing through the wordmark area, and the tagline "Archery Companion" in italic below. Background is a dark green to warm brown gradient.</desc>
