<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 34" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MyShots — Archery Companion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MyShots — Archery Companion</title>
  <desc>MyShots banner. Left side: MYSHOTS wordmark in gold serif capitals followed by "Archery Companion" italic tagline. Dark green to warm brown gradient background with thin gold borders top and bottom.</desc>
  <defs>
    <linearGradient id="myshotsBannerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d4a2e"/>
      <stop offset="100%" stop-color="#4a3826"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="680" height="34" fill="url(#myshotsBannerBg)"/>
  <line x1="0" y1="2" x2="680" y2="2" stroke="#b8965a" stroke-width="0.3" opacity="0.6"/>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#b8965a" stroke-width="0.3" opacity="0.6"/>
  <text x="120" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#c9a961" text-anchor="middle" letter-spacing="3">MYSHOTS</text>
  <text x="255" y="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11" fill="#c9a961" text-anchor="middle" letter-spacing="0.5">Archery Companion</text>
</svg>
