  <line x1="0" y1="5" x2="680" y2="5" stroke="#b8965a" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="75" x2="680" y2="75" stroke="#b8965a" stroke-width="0.5" opacity="0.6"/>
  <g transform="translate(80, 38)" fill="none" stroke="#c9a961" stroke-linecap="round">
